<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scanner Barcode - Home Care Asiyah</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{padding:18px;background:#fff;box-shadow:0 2px 8px #0001}main{max-width:560px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 20px #0001}#reader{width:100%;overflow:hidden;border-radius:12px}#status{margin-top:12px;padding:12px;border-radius:10px;background:#eef3f8;text-align:center}.btn{width:100%;padding:13px;border:0;border-radius:10px;margin-top:12px;font-weight:700}#close{background:#e9eef5}</style></head><body><header><b>Home Care Asiyah — Scanner Barcode</b></header><main><div class="card"><div id="reader"></div><div id="status">Meminta akses kamera...</div><button class="btn" id="close" onclick="window.close()">Kembali</button></div></main><script>(async()=>{const status=document.getElementById('status');let sent=false;function finish(code){if(sent)return;sent=true;code=String(code||'').trim();if(!code)return;status.textContent='Barcode terbaca: '+code;const target=window.opener;try{if(target&&!target.closed){target.postMessage({type:'HOMECARE_BARCODE',barcode:code},'*');setTimeout(()=>window.close(),400);return;}}catch(e){}const u=new URLSearchParams(location.search);const ret=u.get('return');if(ret){location.href=ret+(ret.includes('?')?'&':'?')+'barcode='+encodeURIComponent(code);return;}history.back()}const scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:{exact:'environment'}},{fps:12,qrbox:(w,h)=>({width:Math.min(300,w*.8),height:Math.min(160,h*.45)}),formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR]},(decoded)=>finish(decoded),()=>{});status.textContent='Arahkan barcode ke kamera';}catch(e){status.textContent='Kamera tidak dapat dibuka. Pastikan halaman dibuka melalui HTTPS dan izin kamera Chrome sudah diizinkan.';console.error(e)}})();</script></body></html>
