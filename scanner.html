<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner Barcode - Home Care Asiyah</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{padding:16px;background:#fff;box-shadow:0 2px 8px #0001;font-weight:800}main{max-width:620px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 24px #0001}.camera{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.camera video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:7%;right:7%;top:28%;height:44%;border:3px solid #19d38b;border-radius:12px;box-shadow:0 0 0 9999px #0004}.line{position:absolute;left:9%;right:9%;top:50%;height:2px;background:#19d38b;box-shadow:0 0 8px #19d38b}.status{margin-top:10px;padding:11px;border-radius:10px;background:#eef3f8;text-align:center;font-size:13px}.status.err{background:#fff0f0;color:#c62828;font-weight:700}.manual{display:flex;gap:8px;margin-top:10px}.manual input{min-width:0;flex:1;padding:12px;border:1px solid #d8e0ea;border-radius:10px;font-size:16px}.manual button,.back{border:0;border-radius:10px;padding:12px 16px;font-weight:800}.manual button{background:#0ca86b;color:#fff}.back{width:100%;margin-top:10px;background:#edf2f7;color:#334155}.success{display:none;text-align:center;padding:10px}.code{font:800 22px monospace;margin-top:5px;letter-spacing:1px}</style>
</head>
<body><header>▥ Scanner Barcode — Home Care Asiyah</header><main><div class="card">
<div class="camera"><video id="video" autoplay muted playsinline></video><div class="guide"></div><div class="line"></div><div id="reader" style="display:none;width:100%;height:100%"></div></div>
<div id="status" class="status">Menyiapkan kamera...</div><div id="success" class="success"><b>Barcode berhasil dibaca</b><div id="successCode" class="code"></div></div>
<div class="manual"><input id="manual" placeholder="Ketik barcode manual" inputmode="numeric" autocomplete="off"><button onclick="send(document.getElementById('manual').value)">Gunakan</button></div><button class="back" onclick="goBack()">Batal / Kembali</button>
</div></main>
<script>
const qs=new URLSearchParams(location.search),returnUrl=qs.get('return')||'',mode=qs.get('mode')||'sale',saleIndex=qs.get('saleIndex')||'0';
const video=document.getElementById('video'),statusEl=document.getElementById('status');let stream=null,detector=null,raf=0,done=false,lastCode='',lastAt=0,fallback=null;
function status(t,err=false){statusEl.textContent=t;statusEl.className='status'+(err?' err':'')}
function clean(c){return String(c||'').trim().replace(/\s+/g,'')}
function send(code){code=clean(code);if(!code||done)return;const now=Date.now();if(code===lastCode&&now-lastAt<1500)return;lastCode=code;lastAt=now;done=true;stopAll();document.getElementById('success').style.display='block';document.getElementById('successCode').textContent=code;status('Barcode terbaca. Mengembalikan ke aplikasi...');
try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'HOMECARE_BARCODE',barcode:code,mode,saleIndex},'*');setTimeout(()=>window.close(),120);return}}catch(e){}
if(returnUrl){const base=returnUrl.split('#')[0];const sep=base.includes('?')?'&':'?';const target=base+sep+'barcode='+encodeURIComponent(code)+'&mode='+encodeURIComponent(mode)+'&saleIndex='+encodeURIComponent(saleIndex);setTimeout(()=>{location.href=target},180);return}setTimeout(()=>history.back(),180)}
function stopAll(){if(raf){cancelAnimationFrame(raf);raf=0}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;if(fallback){try{fallback.stop().catch(()=>{})}catch(e){}}}
async function loop(){if(done||!detector)return;try{if(video.readyState>=2){const a=await detector.detect(video);if(a&&a.length){send(a[0].rawValue||'');return}}}catch(e){}raf=requestAnimationFrame(loop)}
async function nativeDetector(){if(!('BarcodeDetector'in window))return false;try{const s=await BarcodeDetector.getSupportedFormats();const w=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];const f=s.filter(x=>w.includes(x));detector=new BarcodeDetector(f.length?{formats:f}:undefined);return true}catch(e){return false}}
async function start(){if(!isSecureContext){status('Scanner harus dibuka melalui HTTPS.',true);return}if(!navigator.mediaDevices?.getUserMedia){status('Browser tidak menyediakan akses kamera.',true);return}try{status('Membuka kamera...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();if(await nativeDetector()){status('Kamera aktif — arahkan barcode ke garis hijau.');loop();return}loadFallback()}catch(e){console.error(e);status('Kamera tidak dapat dibuka. Pastikan HTTPS dan izin kamera Chrome aktif.',true)}}
function loadFallback(){status('Kamera aktif — menyiapkan pembaca barcode...');const sc=document.createElement('script');sc.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';sc.onload=()=>startFallback();sc.onerror=()=>status('Library pembaca barcode gagal dimuat.',true);document.head.appendChild(sc)}
async function startFallback(){try{stopAll();video.style.display='none';document.getElementById('reader').style.display='block';fallback=new Html5Qrcode('reader',{verbose:false});await fallback.start({facingMode:{ideal:'environment'}},{fps:20,qrbox:(w,h)=>({width:Math.min(370,Math.floor(w*.92)),height:Math.min(170,Math.floor(h*.45))}),formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR],experimentalFeatures:{useBarCodeDetectorIfSupported:true}},x=>send(x),()=>{});status('Kamera aktif — arahkan barcode ke garis hijau.')}catch(e){console.error(e);status('Pembaca barcode gagal dimulai.',true)}}
function goBack(){stopAll();if(window.opener&&!window.opener.closed){window.close();return}if(returnUrl)location.href=returnUrl;else history.back()}
window.addEventListener('pagehide',stopAll);start();
</script></body></html>
