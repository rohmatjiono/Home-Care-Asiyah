<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scanner Barcode - Home Care Asiyah</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{padding:16px;background:#fff;box-shadow:0 2px 8px #0001;font-weight:800}main{max-width:620px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 24px #0001}.camera{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}.camera video{width:100%;height:100%;object-fit:cover;display:block}.guide{position:absolute;left:10%;right:10%;top:31%;height:38%;border:3px solid #19d38b;border-radius:12px;box-shadow:0 0 0 9999px #0004}.line{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#19d38b;box-shadow:0 0 8px #19d38b}.status{margin-top:10px;padding:11px;border-radius:10px;background:#eef3f8;text-align:center;font-size:13px}.status.ok{background:#e8fff4;color:#087a4d;font-weight:700}.status.err{background:#fff0f0;color:#c62828;font-weight:700}.manual{display:flex;gap:8px;margin-top:10px}.manual input{min-width:0;flex:1;padding:12px;border:1px solid #d8e0ea;border-radius:10px;font-size:16px}.manual button,.back{border:0;border-radius:10px;padding:12px 16px;font-weight:800}.manual button{background:#0ca86b;color:#fff}.back{width:100%;margin-top:10px;background:#edf2f7;color:#334155}.success{display:none;text-align:center;padding:10px}.code{font:800 22px monospace;margin-top:5px;letter-spacing:1px}
</style>
</head>
<body>
<header>▥ Scanner Barcode — Home Care Asiyah</header>
<main><div class="card">
  <div class="camera"><video id="video" autoplay muted playsinline></video><div class="guide"></div><div class="line"></div><canvas id="canvas" hidden></canvas></div>
  <div id="status" class="status">Menyiapkan kamera...</div>
  <div id="success" class="success"><b>Barcode berhasil dibaca</b><div id="successCode" class="code"></div></div>
  <div class="manual"><input id="manual" placeholder="Ketik barcode manual" inputmode="numeric" autocomplete="off"><button onclick="useManual()">Gunakan</button></div>
  <button class="back" onclick="goBack()">Batal / Kembali</button>
</div></main>
<script>
const qs=new URLSearchParams(location.search);const returnUrl=qs.get('return')||'';const mode=qs.get('mode')||'sale';const saleIndex=qs.get('saleIndex')||'0';
const video=document.getElementById('video'),statusEl=document.getElementById('status');
let stream=null,detector=null,raf=0,done=false,lastCode='',lastAt=0;
function status(t,err=false){statusEl.textContent=t;statusEl.className='status'+(err?' err':'')}
function cleanCode(c){return String(c||'').trim().replace(/\s+/g,'')}
function send(code){code=cleanCode(code);if(!code||done)return;const now=Date.now();if(code===lastCode&&now-lastAt<1200)return;lastCode=code;lastAt=now;done=true;stop();document.getElementById('success').style.display='block';document.getElementById('successCode').textContent=code;status('Barcode terbaca. Mengembalikan ke aplikasi...');
 try{if(window.opener&&!window.opener.closed){window.opener.postMessage({type:'HOMECARE_BARCODE',barcode:code,mode,saleIndex},'*');setTimeout(()=>window.close(),180);return;}}catch(e){}
 if(returnUrl){const base=returnUrl.split('#')[0];const sep=base.includes('?')?'&':'?';location.replace(base+sep+'barcode='+encodeURIComponent(code)+'&mode='+encodeURIComponent(mode)+'&saleIndex='+encodeURIComponent(saleIndex));return}
 history.back();}
function useManual(){send(document.getElementById('manual').value)}
function stop(){if(raf)cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function detectLoop(){if(done||!detector)return;try{if(video.readyState>=2){const hits=await detector.detect(video);if(hits&&hits.length){send(hits[0].rawValue||hits[0].value||'');return}}}catch(e){}raf=requestAnimationFrame(detectLoop)}
async function startNativeDetector(){if(!('BarcodeDetector' in window))return false;try{const supported=BarcodeDetector.getSupportedFormats?await BarcodeDetector.getSupportedFormats():[];const wanted=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','codabar'];const formats=supported.filter(x=>wanted.includes(x));detector=new BarcodeDetector(formats.length?{formats}:undefined);return true}catch(e){return false}}
async function start(){if(!window.isSecureContext){status('Scanner harus dibuka melalui HTTPS.',true);return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){status('Browser tidak menyediakan akses kamera.',true);return}try{status('Membuka kamera...');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();if(await startNativeDetector()){status('Kamera aktif. Arahkan barcode ke garis hijau.');detectLoop();return}status('Kamera aktif. Menyiapkan pembaca barcode...');const sc=document.createElement('script');sc.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';sc.onload=()=>fallback();sc.onerror=()=>status('Pembaca barcode gagal dimuat.',true);document.head.appendChild(sc)}catch(e){console.error(e);status('Kamera tidak dapat dibuka. Pastikan HTTPS dan izin kamera Chrome sudah diizinkan.',true)}}
async function fallback(){try{stop();const box=document.querySelector('.camera');box.innerHTML='<div id="reader" style="width:100%;height:100%"></div><div class="guide"></div><div class="line"></div>';const sc=new Html5Qrcode('reader',{verbose:false});await sc.start({facingMode:{ideal:'environment'}},{fps:20,qrbox:(w,h)=>({width:Math.min(360,Math.floor(w*.9)),height:Math.min(150,Math.floor(h*.42))}),formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.CODABAR]},x=>{try{sc.stop()}catch(e){}send(x)},()=>{});window._fallback=sc;status('Kamera aktif. Arahkan barcode ke garis hijau.')}catch(e){console.error(e);status('Pembaca barcode gagal dimulai.',true)}}
function goBack(){stop();try{if(window._fallback){window._fallback.stop().catch(()=>{});window._fallback.clear().catch(()=>{})}}catch(e){}if(window.opener&&!window.opener.closed){window.close();return}if(returnUrl)location.replace(returnUrl);else history.back()}
window.addEventListener('pagehide',stop);start();
</script>
</body></html>
